<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>KAWE TRALHA</title>
<style>
  :root{
    --gold:#ffd23f;--amber:#ff8a1f;--ice:#9fdcff;--blue:#2f8cff;
    --ring:conic-gradient(from 210deg,#ffd23f,#fff3b8,#9fdcff,#2f8cff,#9fdcff,#ffd23f);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%;background:#000}
  body{
    font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:#fff;display:flex;justify-content:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    background:
      radial-gradient(70% 38% at 15% 8%,rgba(120,165,255,.16),transparent 70%),
      radial-gradient(55% 32% at 92% 52%,rgba(255,255,255,.06),transparent 70%),
      radial-gradient(80% 45% at 50% 100%,rgba(70,120,255,.14),transparent 70%),
      #000;
    background-attachment:fixed;
  }
  #space{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .page{
    position:relative;z-index:1;width:100%;max-width:430px;
    padding:44px 20px 40px;display:flex;flex-direction:column;align-items:center;
  }

  /* avatar */
  .avatar{
    position:relative;width:128px;height:128px;border-radius:50%;padding:4px;
    background:var(--ring);
    box-shadow:0 0 30px rgba(80,160,255,.5),0 0 16px rgba(255,210,63,.4),0 0 80px rgba(120,170,255,.18);
  }
  .avatar .inner{width:100%;height:100%;border-radius:50%;overflow:hidden;border:3px solid #04060c;background:#04060c}
  .avatar img{width:100%;height:100%;display:block;object-fit:cover}
  .avatar .dot{
    position:absolute;right:9px;bottom:11px;width:17px;height:17px;border-radius:50%;
    background:var(--gold);border:3px solid #04060c;box-shadow:0 0 10px rgba(255,210,63,.9);
  }

  /* status */
  .pill{
    margin-top:18px;display:inline-flex;align-items:center;gap:8px;padding:4px 16px 4px 4px;
    border-radius:999px;font-size:13px;font-style:italic;font-weight:600;
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    border:1.5px solid rgba(159,220,255,.6);
    box-shadow:0 0 16px rgba(80,160,255,.28),inset 0 0 12px rgba(120,170,255,.12);
  }
  .coin{
    width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle at 35% 30%,#8dffb0,#19b552 70%,#0e8a3a);border:1.5px solid #c9ffd9;
    box-shadow:0 0 10px rgba(40,220,110,.55);
    font-style:normal;font-weight:800;font-size:13px;color:#053d17;
  }

  /* título */
  .title{margin-top:28px;display:flex;align-items:center;gap:8px}
  .title h1{
    font-family:"Impact","Arial Black","Haettenschweiler",system-ui,sans-serif;
    font-weight:900;font-style:italic;font-size:44px;line-height:1;letter-spacing:-.5px;white-space:nowrap;
    transform:skewX(-6deg);
    background:linear-gradient(180deg,#fff 0%,#f4f8ff 55%,#d6e6ff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(8,28,80,.7)) drop-shadow(0 0 10px rgba(130,185,255,.35));
  }
  .verified{width:22px;height:22px;flex:none;margin-top:-14px;filter:drop-shadow(0 0 6px rgba(60,160,255,.8))}
  .underline{
    margin-top:8px;width:170px;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#fff3b8,#9fdcff,transparent);
    box-shadow:0 0 10px rgba(160,210,255,.8);
  }

  .label-row{width:100%;margin-top:34px;display:flex;justify-content:flex-end}
  .label{display:inline-flex;align-items:center;gap:4px;font-size:8px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:rgba(255,255,255,.75)}
  .label svg{width:9px;height:9px}

  /* plataforma */
  .platform{width:100%;margin-top:14px;display:flex;align-items:center;gap:14px;padding-left:4px}
  .thumb{
    width:124px;flex:none;padding:3px;border-radius:16px;background:var(--ring);
    box-shadow:0 0 22px rgba(80,160,255,.45),0 0 12px rgba(255,210,63,.3);
  }
  .thumb img{width:100%;display:block;aspect-ratio:412/287;object-fit:cover;border-radius:13px;border:2px solid #04060c}
  .platform h2{
    font-family:"DIN Condensed","Avenir Next Condensed","Bahnschrift","Roboto Condensed","Oswald","Arial Narrow",Impact,sans-serif;
    font-weight:800;font-size:50px;line-height:1;letter-spacing:1px;white-space:nowrap;
    filter:drop-shadow(0 2px 0 rgba(0,20,60,.8)) drop-shadow(0 0 14px rgba(90,170,255,.35));
  }
  .platform h2 span{-webkit-background-clip:text;background-clip:text;color:transparent}
  .platform .n{background-image:linear-gradient(180deg,#fff 15%,#bfe8ff 55%,#4fc3ff 100%)}
  .platform .r{background-image:linear-gradient(180deg,#fff7c9 10%,#ffe14d 55%,#ffb800 100%)}

  /* botão principal */
  .cta{
    margin-top:18px;width:100%;display:flex;align-items:center;gap:12px;
    padding:12px 14px;border-radius:18px;text-decoration:none;color:#fff;
    background:linear-gradient(95deg,#4fc3ff 0%,#2f8cff 48%,#1b5fe0 100%);
    border:2px solid rgba(190,230,255,.75);
    box-shadow:0 0 26px rgba(60,150,255,.55),0 6px 0 rgba(8,45,130,.75),inset 0 2px 0 rgba(255,255,255,.5);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .cta:active{transform:translateY(3px);box-shadow:0 0 20px rgba(60,150,255,.5),0 3px 0 rgba(8,45,130,.75),inset 0 2px 0 rgba(255,255,255,.5)}
  .cta .play{width:42px;height:42px;border-radius:50%;flex:none;background:#06173a;display:grid;place-items:center;border:2px solid #9fdcff}
  .cta .play svg{width:16px;height:16px;margin-left:2px}
  .cta .txt{flex:1;min-width:0}
  .cta strong{display:block;font-size:17px;font-weight:800;letter-spacing:.2px;text-shadow:0 1px 2px rgba(0,30,100,.5)}
  .cta small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:1px}
  .cta .go{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;background:rgba(6,30,90,.55);border:1px solid rgba(190,230,255,.45)}
  .cta .go svg{width:16px;height:16px}

  .legal{margin-top:28px;font-size:10px;color:rgba(255,255,255,.4);text-align:center}
  a:focus-visible{outline:3px solid #fff;outline-offset:3px}
  @media (max-width:370px){
    .title h1{font-size:36px}
    .thumb{width:104px}
    .platform h2{font-size:42px}
  }

  [hidden]{display:none!important}
  /* ===== portão: segure para entrar ===== */
  #gate{position:fixed;inset:0;z-index:3;display:flex;padding:6vh 20px 20px;overflow:auto;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:opacity .4s ease,transform .4s ease}
  #gate::before{content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(160,200,255,.09) 1px,transparent 1.3px);background-size:6px 6px;
    -webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%)}
  #gate.out{opacity:0;transform:scale(.97);pointer-events:none}
  #bio.in{animation:bioIn .6s ease both}
  @keyframes bioIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .gcard{position:relative;width:100%;max-width:352px;margin:auto;padding:28px 23px 24px;border-radius:32px;
    display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(180deg,rgba(14,22,42,.78),rgba(4,7,14,.88));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    box-shadow:0 0 44px rgba(60,130,255,.2),0 20px 60px rgba(0,0,0,.6)}
  .gcard::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--ring);pointer-events:none;
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
  .gpill{display:inline-flex;align-items:center;gap:9px;padding:7px 15px;border-radius:999px;
    border:1px solid rgba(159,220,255,.38);background:rgba(255,255,255,.04);
    font-size:11px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:rgba(255,255,255,.85)}
  .gpill i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .gid{margin-top:16px;display:flex;align-items:center;gap:12px}
  .gav{width:58px;height:58px;border-radius:50%;padding:2.5px;background:var(--ring);flex:none;box-shadow:0 0 16px rgba(80,160,255,.45)}
  .gav img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;border:2px solid #04060c}
  .gname{display:flex;align-items:center;gap:6px}
  .gname b{font-family:"Impact","Arial Black","Haettenschweiler",system-ui,sans-serif;font-weight:900;font-style:italic;
    font-size:26px;line-height:1;white-space:nowrap;display:inline-block;transform:skewX(-6deg);
    background:linear-gradient(180deg,#fff 0%,#f4f8ff 55%,#d6e6ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 0 rgba(8,28,80,.7)) drop-shadow(0 0 8px rgba(130,185,255,.35))}
  .gname svg{width:15px;height:15px;flex:none;margin-top:-6px;filter:drop-shadow(0 0 5px rgba(60,160,255,.8))}
  .gh{margin-top:4px;font-size:13px;color:rgba(255,255,255,.55)}
  .hold{position:relative;width:140px;height:140px;margin-top:18px;border:0;background:none;border-radius:50%;cursor:pointer;
    color:rgba(255,255,255,.5);touch-action:none;-webkit-tap-highlight-color:transparent;transition:transform .2s ease}
  .hold svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .halo{fill:rgba(130,180,255,.08);animation:br 3.2s ease-in-out infinite}
  @keyframes br{50%{opacity:.35}}
  .track{fill:none;stroke:rgba(159,220,255,.5);stroke-width:1.5}
  .core{fill:rgba(8,14,30,.92);stroke:rgba(255,255,255,.14)}
  .prog{fill:none;stroke:url(#pg);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;opacity:0;
    transform:rotate(-90deg);transform-origin:70px 70px;filter:drop-shadow(0 0 5px rgba(255,210,63,.7))}
  .hold .fp{position:absolute;left:50%;top:50%;width:46px;height:46px;inset:auto;margin:-23px 0 0 -23px;fill:none;stroke:currentColor;
    stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transition:color .2s,filter .2s}
  .hold.active{transform:scale(.96)}
  .hold.active .fp{color:#bfe8ff;filter:drop-shadow(0 0 6px rgba(120,190,255,.9))}
  .gt{margin-top:18px;font-size:22px;font-weight:700;letter-spacing:-.2px}
  .gs{margin-top:6px;font-size:13px;color:rgba(255,255,255,.58);text-align:center}
  .bars{margin-top:26px;display:flex;gap:10px}
  .bars i{width:25px;height:4px;border-radius:4px;background:var(--gold);box-shadow:0 0 8px rgba(255,210,63,.5);transition:background .25s,box-shadow .25s}
  .bars i.on{background:#4fc3ff;box-shadow:0 0 8px rgba(79,195,255,.85)}
  .gline{margin-top:20px;width:100%;height:1px;background:rgba(159,220,255,.18)}
  .gf{margin-top:18px;display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.55)}
  .gf svg{width:15px;height:15px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion:reduce){#gate,#bio.in,.halo{transition:none;animation:none}}
</style>
</head>

  </div>
</section>

<script>
(function(){
  var c=document.getElementById('space'),x=c.getContext('2d'),W,H,S=[],shoot=null,next=0,
      still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rnd(a,b){return a+Math.random()*(b-a)}
  function init(){
    var d=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);
    var n=Math.min(320,Math.round(W*H/3200));S=[];
    for(var i=0;i<n;i++){
      var big=Math.random()<.07;
      S.push({x:rnd(0,W),y:rnd(0,H),r:big?rnd(1.3,2):rnd(.3,1.2),a:rnd(.35,1),
              f:rnd(.4,1.8),p:rnd(0,6.28),v:rnd(1.5,5),big:big,
              t:Math.random()<.2?'200,225,255':'255,255,255'});
    }
  }
  function draw(t){
    x.clearRect(0,0,W,H);
    for(var i=0;i<S.length;i++){
      var s=S[i],tw=still?1:.55+.45*Math.sin(t/1000*s.f+s.p),al=s.a*tw;
      if(!still){s.y-=s.v/60;if(s.y<-4){s.y=H+4;s.x=rnd(0,W)}}
      x.fillStyle='rgba('+s.t+','+al+')';
      x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill();
      if(s.big){
        var g=x.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*7);
        g.addColorStop(0,'rgba('+s.t+','+al*.45+')');g.addColorStop(1,'rgba('+s.t+',0)');
        x.fillStyle=g;x.beginPath();x.arc(s.x,s.y,s.r*7,0,6.283);x.fill();
        x.strokeStyle='rgba('+s.t+','+al*.5+')';x.lineWidth=.6;x.beginPath();
        x.moveTo(s.x-s.r*6,s.y);x.lineTo(s.x+s.r*6,s.y);x.moveTo(s.x,s.y-s.r*6);x.lineTo(s.x,s.y+s.r*6);x.stroke();
      }
    }
    if(!still){
      if(!shoot&&t>next){shoot={x:rnd(W*.2,W),y:rnd(0,H*.4),l:0};next=t+rnd(6000,11000)}
      if(shoot){
        shoot.l+=14;var a=Math.min(1,(180-shoot.l)/120),dx=shoot.x-shoot.l*.85,dy=shoot.y+shoot.l*.5;
        var g2=x.createLinearGradient(shoot.x-(shoot.l-60)*.85,shoot.y+(shoot.l-60)*.5,dx,dy);
        g2.addColorStop(0,'rgba(255,255,255,0)');g2.addColorStop(1,'rgba(255,255,255,'+Math.max(a,0)+')');
        x.strokeStyle=g2;x.lineWidth=1.6;x.beginPath();
        x.moveTo(shoot.x-(shoot.l-60)*.85,shoot.y+(shoot.l-60)*.5);x.lineTo(dx,dy);x.stroke();
        if(shoot.l>200)shoot=null;
      }
      requestAnimationFrame(draw);
    }
  }
  init();addEventListener('resize',function(){init();if(still)draw(0)});
  next=2500;still?draw(0):requestAnimationFrame(draw);
})();
</script>
<script>
(function(){
  var g=document.getElementById('gate'),b=document.getElementById('hold'),bio=document.getElementById('bio'),
      pr=b.querySelector('.prog'),bars=g.querySelectorAll('.bars i'),p=0,on=false,last=0,raf=0,DUR=1300;
  document.getElementById('gAv').src=bio.querySelector('.avatar img').src;
  function paint(){
    pr.style.strokeDashoffset=100-p*100;pr.style.opacity=p>0.004?1:0;
    for(var i=0;i<3;i++)bars[i].classList.toggle('on',p>=(i+1)/3-.001);
  }
  function enter(){
    if(navigator.vibrate)try{navigator.vibrate(25)}catch(e){}
    g.classList.add('out');
    setTimeout(function(){g.hidden=true;bio.hidden=false;bio.classList.add('in');scrollTo(0,0)},420);
  }
  function tick(t){
    var dt=Math.min(t-last,50);last=t;
    p=Math.max(0,Math.min(1,p+(on?dt/DUR:-dt/350)));paint();
    if(p>=1){raf=0;enter();return}
    raf=(on||p>0)?requestAnimationFrame(tick):0;
  }
  function hold(v){
    if(g.classList.contains('out'))return;
    on=v;b.classList.toggle('active',v);
    if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}
  }
  b.addEventListener('pointerdown',function(e){e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(x){}hold(true)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(function(n){b.addEventListener(n,function(){hold(false)})});
  b.addEventListener('contextmenu',function(e){e.preventDefault()});
  b.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();hold(true)}});
  b.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter')hold(false)});
})();
</script>
</body>
</html>
